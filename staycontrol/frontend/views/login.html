<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayControl - Iniciar Sesión</title>

    <link rel="preload" href="../assets/fonts/DMSans-Variable.ttf" as="font" type="font/ttf" crossorigin>

    <link rel="stylesheet" href="../assets/css/login.css">
    <link rel="stylesheet" href="../assets/css/experiencia.css">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/assets/icons/pwa-180.png">
    <link rel="stylesheet" href="../assets/css/pwa.css">
</head>

<body>

    <main class="login">

        <!-- Área superior -->
        <section class="top-area">

            <!-- Branding -->
            <section class="brand-section">

                <div class="logo-box">
                    <svg
                        class="key-icon"
                        viewBox="0 0 32 32"
                        fill="none"
                        aria-hidden="true"
                    >
                        <circle cx="11.5" cy="20.5" r="7.2"
                                stroke="white"
                                stroke-width="2"/>
                        <path
                            d="M16.5 15.5L25.5 6.5M22 10L25 13M24.5 7.5L27 10"
                            stroke="white"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                </div>

                <div class="brand-text">
                    <h1>StayControl</h1>
                    <p>Gestión inteligente de arriendos</p>
                </div>

            </section>

            <!-- Formulario -->
            <section class="form-section">

                <!-- Email -->
                <div class="field">
                    <label for="email">Correo Electrónico</label>

                    <div class="input-container">
                        <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"
                                stroke="currentColor"
                                stroke-width="2"
                            />
                            <path
                                d="M4 7l8 6 8-6"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                        </svg>

                        <input
                            type="email"
                            id="email"
                            placeholder="tu-correo@ejemplo.com"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <!-- Password -->
                <div class="field">
                    <label for="password">Contraseña</label>

                    <div class="input-container">

                        <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect
                                x="5"
                                y="10"
                                width="14"
                                height="10"
                                rx="2"
                                stroke="currentColor"
                                stroke-width="2"
                            />
                            <path
                                d="M8 10V7a4 4 0 0 1 8 0v3"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                            />
                        </svg>

                        <input
                            type="password"
                            id="password"
                            placeholder="Tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="eye-button"
                            id="togglePassword"
                            aria-label="Mostrar contraseña"
                        >
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path
                                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                />
                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                />
                            </svg>
                        </button>

                    </div>
                </div>

                <!-- Recuperar contraseña -->
                <div class="forgot-password">
                    <a href="/recuperar-contrasena">¿Olvidaste tu contraseña?</a>
                </div>

            </section>

        </section>

        <!-- Área inferior -->
        <section class="bottom-area">

            <p id="loginNotice" role="status" aria-live="polite"></p>
            <button type="button" class="login-button" id="loginButton">
                Iniciar Sesión
            </button>

            <div class="register-footer">
                <span>¿No tienes una cuenta?</span>
                <a href="/registro">Regístrate</a>
            </div>

        </section>

    </main>

    <script type="module" src="../controllers/loginController.js"></script>
    <script type="module" src="../controllers/pwaController.js"></script>
</body>
</html>
