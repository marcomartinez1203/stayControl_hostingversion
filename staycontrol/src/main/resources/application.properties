spring.application.name=staycontrol
app.hotel.zone=${HOTEL_ZONE:America/Bogota}
# Único propietario de las colecciones previas al aislamiento. Vacío: quedan inaccesibles.
app.hotel.legacy-owner-email=${LEGACY_HOTEL_OWNER_EMAIL:}
# Desarrollo local por defecto; HTTPS obligatorio antes de exponer sesiones en una red pública.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# Aprovisionamiento explícito; no hay usuarios ni contraseñas predeterminados.
app.auth.bootstrap.enabled=${AUTH_BOOTSTRAP_ENABLED:false}
app.auth.bootstrap.email=${AUTH_ADMIN_EMAIL:}
app.auth.bootstrap.password=${AUTH_ADMIN_PASSWORD:}
# Evitar aceptar campos desconocidos, estados numéricos o capacidades fraccionarias.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
spring.jackson.deserialization.accept-float-as-int=false
# Configuración local: funciona desde la carpeta del proyecto y desde VS Code.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# Spring Boot 4 usa spring.mongodb para la conexión.
spring.mongodb.uri=${MONGODB_URI:}
spring.mongodb.database=${MONGODB_DATABASE:staycontrol}
app.mongodb.verify-on-startup=${MONGODB_VERIFY_ON_STARTUP:true}

# Vue compilado por npm run build; recursos empaquetados como respaldo.
spring.web.resources.static-locations=file:./frontend/dist/,classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/
